[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "birdsun44-ansleak"
version = "0.1.0"
description = "通过字符级与结构级特征识别提示词的示例答案泄漏的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "birdsun44" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://birdsun44.github.io"
Repository = "https://github.com/birdsun44/ansleak"
Issues = "https://github.com/birdsun44/ansleak/issues"

[project.scripts]
ansleak = "ansleak:main"

[tool.setuptools]
py-modules = ["ansleak"]
